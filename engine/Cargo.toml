[package]
name = "mo2d"
version = "0.1.0"
edition = "2021"
description = "mo2d headless engine — everything is a line (万物皆线). MVP: a moving tentacle + a z≠0 static scene, built entirely via the command protocol."
license = "MIT OR Apache-2.0"

# CPU oracle determinism is dependency-free (see gpumetal history / log.md).
# wgpu (Apache-2.0 OR MIT) is the owner-approved GPU accelerator path
# (2026-11-12); pollster (Apache-2.0 OR MIT) blocks on wgpu futures.
[dependencies]
pollster = "1.0.1"
wgpu = "30.0.1"

[lib]
name = "mo2d"
path = "src/lib.rs"

[[bin]]
name = "mo2d"
path = "src/bin/mo2d.rs"

[profile.release]
debug = false
